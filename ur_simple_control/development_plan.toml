[[project_plan.action_items]]
name = "smc refactor"
description = """
during the development of code for the wara challenge, a whole bunch of new features have been introduced in the quickest manner possible with absolute disregard for code quality. the biggest issue is the sequence of if's in some many different places. some of the issues are: 
1) having the same robotmanager class for different robots which makes 
it unreadable - there's some many ifs you forget which function you're looking at.
2) ifs for two-armed goals, making it difficult to keep track of which goal is which
3) having or not having a mobile base - if the robot can't move, there is no point in having navigation, and the code itself should know about this - otherwise you need to think for the computer.  also, in mobile navigation there are times when you do not want all joint variables to be  one big array, which then leads to ugly chopping and slicing over the array. ] this is not something you want to think about when writing navigation algorithms for example -  this separation of concerns needs to be available with its own API. 
4) ros stuff is tacked-on and it's ugly as it currently is

on top of solving the issues above, the refactoring should also:
5) ensure separation of concerns
6) have a clean cut between smc and albin's path planning - smc should just take the output of the path planner and then not see it again.
7) process manager should be able to support rtp's on a different computer - necessary for smooth integration of remote GPU for computer vision
8) cut many random todos scattered throughout the code
9) args from argparse are getting exceedengly long so there should be an option to load them from a config file which can be overwritten with actual arguments.
"""
priority = 1
deadline = 2025-01-31
dependencies = []
purpose = """
making new features actually usable
"""
hours_required = 0
is_done = false


