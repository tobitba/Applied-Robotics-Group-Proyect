[[project_plan.action_items.action_items]]
name = "fixing QP, putting in adding variants with manip maxing and similar"
description = """
the QP formulation is the goated inverse kinematics formulation.
there are multiple QP solvers out there, and all of the tested ones should be 
made available (in order or performance and preference of course).

for some reason the current version does not work every time and that
makes absolutely no sense to me. that has to be investigated.

SOLUTION: i'm pretty sure i used a wrong version of the QP formulation at a time, where V = Jv was a constraints. and this is exactly contradicting the v_min < v < v_max constraint. so the problem is infeasible by construction if V is too big. instead, make the task a costs: min v | Jv - V|. works perfectly and moves linearly with this.
"""
priority = 1
deadline = 2025-09-01
is_done = true
dependencies = []
purpose = """QP is the best inverse kinematics formulation and should therefore be available"""
hours_required = 12

