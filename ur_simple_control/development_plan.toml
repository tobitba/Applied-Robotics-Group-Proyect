[[project_plan.action_items.action_items]]
name = "behavior trees"
description = """
for the robot to do more complicated tasks, a behavior tree needs to be formed
to select different actions depending on the criteria. 
automatons correspond to intelligence of an insect, and that's what gets 
the job done and is understandeable.

the way this works now is you assosiate a number with each control loop you want
running (there can only be one at one time), have sensors or whatever else
obtain the state and also associate it with a number - that's the control loop
you want to run at this time.
this is even more primitive because you could have different transitions.
of course you still have an automaton, but one that's easier to model
for a human.

this is a job for behaviour trees - the robotics way of saying the robot is 
an automaton which does a thing per state, with defined transitions between states.
there's libraries with GUI tools for setting these trees and other goodies.
ideally you should just integrate with some of these - writing
a ton of ifs is untennable if you have more than 4-5 states.

in any event, whatever amount logic is implemented here should be 
a separate part of smc. it should be abstract enough so that it's 
easy to generate new behaviour trees from existing primitives (controlLoops).
once you have a behavior tree, you stick it into a control loop which
executes the control loop associated with the current state and that's it.
the point is this should be cleanly done, not all shoved into one example file.
"""
priority = 2
deadline = 2025-09-01
is_done = false
dependencies = []
purpose = """behavior tree support that isn't a complete hack unusable in the future.
it does not need to be great, or even good, but it has to be clean"""
hours_required = 12


