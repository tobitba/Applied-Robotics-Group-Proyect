[project_plan]
name = "smc development plan"
description = """
the simple manipulator control library is my phd's flagship software. it will forever retain its essential characteric -  get it the robot's urdf, a function to read the robot's state as a vector of number, a function to send the velocity or torque command input, and it will give you the simplest possible API to write your control loop  as a few lines of math. on top of that, batteries are included in the sense that it already provides the basic controllers  noone wants to be bothered with writing like clik or joint movements. 

however, circumstances led to a significat increase of its scope: supporting mobile robots, torque-controlled robots,  various optimal control libraries, interactive tuning, dual arm support, whole-body control, ros interface, path planning, multi-robot support, visual servoing and more. literally none of these things follow the core of idea of simplicity and of a limited scope. however, none of them hurt the basic functionality either - they are modular add-ons to the basic scope of simple wrappers around control math. you can use the library as originally intended without interacting or even installing those extensions. 

this project became and continues to be collection of everything i've ever done in robotics. but, crucially, since there is a common desing pattern over the whole code-base, these parts can mixed and matched, making all future projects easier because of all the pre-solved parts being easily reusable. so in any event i am benefiting from  the library's development. 

the key question is whether it can be useful to other people. if so, doing some amount of additional work to polish it makes sense. looking at the wider ros ecosystem, other engineers' opinions of it,  and the lack of anything else of the sort out there, it seems like there will be people interested in it - specifically those who want to implement their own control stacks.  at that point you need to code anyway, and this library will save you a ton of time because there's so much less overhead than ros. on a personal level, it seems very valuable to develop and manage a large codebase too. so the investment into making it cohesive, well documented and easy to use for newcomers (both for shipping and with examples) will be made. 

since i have other things to do, the progress will be very spread out in time and incremental. this makes planning all the more important. the specific sub-projects and feature are outlined in their separate action items. the deadline for the next version is the beggining of the next academic year (2025/2026) so that the new version can be fully employed by the students. 

having that said, this developing this library can't never be priority number 1, unless parts of it are necessary for projects which are priority number 1, i.e. specific papers. the given deadline is just for the next full version, after which a plan and deadline for the next version is to be made. 
""" 
priority = 2
deadline = 2025-09-01
dependencies = []
engineering_purpose = """a library for easy and quick robotics prototyping"""
personal_purpose = """easier time programming robots, flagship software for future employment,
open source software publication in its own right"""
# -1 means it should be a sum over sub-items
hours_required = 0
is_done = false


