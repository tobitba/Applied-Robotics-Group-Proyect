1) find out how to do static type-checking in python (mypy etc)
2) find out what linting and other concepts are
3) learn related python concepts: decorators, type overloading and the rest
4) find out how to make nvim use this automatically
5) test different software (different lsp server, different lsp configuration and so on)

additionally, the dependencies should be compiled so that they generate
python stubs so that type-checking actually works, or whatever else is necessary.

TODO: break this up into smaller action items, this is a classic too big,
unactionable todo that we are trying to avoid by writing stuff out
"""
