1. first you need to test if viz.display() exits immediately, regardless of whether the displaying is done. if yes, just don't start it as a side process.
2. see what the fuck changed in the underlying _Popen, it could be copy-pasting the passed arguments incorrectly, idk. if it's in an official update, great, if not, we're kinda boned. and it's this 100% beucase starting meshcat directly is fine (few seconds as before), and loading of model, visual model and collision model directly also takes the expected few seconds as before.
3. alternatively, if the side-process startup can't be helped, it might be better to load the robot model again, but in the viz process.
