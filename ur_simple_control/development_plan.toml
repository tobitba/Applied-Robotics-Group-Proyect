name = "correct packaging"
description = """
having some comments in code, something in a README, a massive pdf and a collection of video tutorials on pre-requirements (and some smc tutorials) is simply not the correct way to package all this information. in fact, nothing is "the best". depending on what you need and are looking to find, different formats will suite different purposes. there's no way around that. a book is for people that want to go through everything systematically. a video when you prefer watching somethign over reading it. it also completely beats reading in terms of introductory and expository value (just like books beat anything else for deep learning). for code, i want it in the code, and i want a generated website to clik around the library (jump through definitions) because that also renders the math.

Now, the good thing is that we can switch between a pdf, a website, etc by a) having nice tools for that, and b) being smart about how things should be structured.

The documentation covers:
- code design principals
- actual code documentation
- notes on robot control
- actual control algorithms and functions

And from this you want text for totally diferent audiences:
- the shortest possible crash course for non-robotics people doing a project
- a deep dive for people who want to go beyond the crash course
- quick reference for experienced practitioners that don't want a lot of fluff, just the novel stuff
- de facto an educational course on robotics mixing theory and hands-on stuff for people with a weak background that don't know anything about a robot.

